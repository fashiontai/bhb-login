AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC role for deploying the BHB Login SAM stack.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or user name.
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume this role when GitHubEnvironment is empty.
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Environment allowed to assume this role. Leave empty to use branch-based trust.
  RoleName:
    Type: String
    Default: github-actions-bhb-login
    Description: IAM role name for GitHub Actions.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing GitHub OIDC provider ARN. Leave empty to create one.

Conditions:
  HasExistingGitHubOidcProvider: !Not
    - !Equals
      - !Ref ExistingGitHubOidcProviderArn
      - ""
  ShouldCreateGitHubOidcProvider: !Equals
    - !Ref ExistingGitHubOidcProviderArn
    - ""
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubOidcProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Url: https://token.actions.githubusercontent.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - HasExistingGitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
                - !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: bhb-login-sam-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation deployment lifecycle.
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:ListStacks
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource: "*"
              # SAM artifact bucket lifecycle.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:DeleteObject
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetObject
                  - s3:DeleteBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:ListBucket
                  - s3:PutBucketAcl
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutObject
                  - s3:PutBucketPublicAccessBlock
                  - s3:TagResource
                  - s3:UntagResource
                Resource: "*"
              # Serverless application resources.
              - Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:TagResource
                  - apigateway:UntagResource
                  - ec2:AllocateAddress
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateInternetGateway
                  - ec2:CreateNatGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteNatGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteTags
                  - ec2:DeleteVpc
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:GetSecurityGroupsForVpc
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:ReleaseAddress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagLogGroup
                  - logs:TagResource
                  - logs:UntagResource
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:InvokeFunction
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - rds:AddTagsToResource
                  - rds:CreateDBCluster
                  - rds:CreateDBClusterSnapshot
                  - rds:CreateDBInstance
                  - rds:CreateDBSnapshot
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBCluster
                  - rds:DeleteDBClusterSnapshot
                  - rds:DeleteDBInstance
                  - rds:DeleteDBSnapshot
                  - rds:DeleteDBSubnetGroup
                  - rds:DescribeDBClusters
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBSubnetGroups
                  - rds:ListTagsForResource
                  - rds:ModifyDBCluster
                  - rds:ModifyDBInstance
                  - rds:ModifyDBSubnetGroup
                  - rds:RemoveTagsFromResource
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetRandomPassword
                  - secretsmanager:GetSecretValue
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:PutSecretValue
                  - secretsmanager:RestoreSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                  - secretsmanager:UpdateSecret
                Resource: "*"
              # IAM roles created by SAM.
              - Effect: Allow
                Action:
                  - iam:AddRoleToInstanceProfile
                  - iam:AttachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:CreateRole
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteInstanceProfile
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetInstanceProfile
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListInstanceProfiles
                  - iam:ListInstanceProfilesForRole
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: "*"
              # ECR repository deployment.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DeleteLifecyclePolicy
                  - ecr:DeleteRepository
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetAuthorizationToken
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetLifecyclePolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:ListTagsForResource
                  - ecr:PutImage
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:PutLifecyclePolicy
                  - ecr:SetRepositoryPolicy
                  - ecr:StartImageScan
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:UploadLayerPart
                Resource: "*"
              # CloudWatch Synthetics deployment.
              - Effect: Allow
                Action:
                  - synthetics:CreateCanary
                  - synthetics:DeleteCanary
                  - synthetics:DescribeCanaries
                  - synthetics:GetCanary
                  - synthetics:StartCanary
                  - synthetics:StopCanary
                  - synthetics:TagResource
                  - synthetics:UntagResource
                  - synthetics:UpdateCanary
                Resource: "*"
              # Read the managed Synthetics layer.
              - Effect: Allow
                Action:
                  - lambda:GetLayerVersion
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:172291836251:layer:Synthetics:*"
              # Lambda, SNS, and SQS messaging resources.
              - Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                  - lambda:UpdateEventSourceMapping
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetSubscriptionAttributes
                  - sns:GetTopicAttributes
                  - sns:ListTagsForResource
                  - sns:ListSubscriptionsByTopic
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:TagResource
                  - sns:Unsubscribe
                  - sns:UntagResource
                  - sqs:AddPermission
                  - sqs:CreateQueue
                  - sqs:DeleteMessage
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                  - sqs:RemovePermission
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: "*"
              # Update filters only on this project's operations topic.
              - Effect: Allow
                Action:
                  - sns:SetSubscriptionAttributes
                Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:bhb-login-ops-notifications"
              # EventBridge operations rules.
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:ListTagsForResource
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource: "*"
              # ECS Fargate deployment.
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:CreateService
                  - ecs:DeleteCluster
                  - ecs:DeleteService
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListAccountSettings
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:ListTagsForResource
                  - ecs:ListTaskDefinitionFamilies
                  - ecs:ListTaskDefinitions
                  - ecs:ListTasks
                  - ecs:PutClusterCapacityProviders
                  - ecs:RegisterTaskDefinition
                  - ecs:RunTask
                  - ecs:StopTask
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:UpdateCluster
                  - ecs:UpdateService
                Resource: "*"
              # Cloud Map service discovery.
              - Effect: Allow
                Action:
                  - servicediscovery:CreatePrivateDnsNamespace
                  - servicediscovery:CreateService
                  - servicediscovery:DeleteNamespace
                  - servicediscovery:DeleteService
                  - servicediscovery:GetNamespace
                  - servicediscovery:GetOperation
                  - servicediscovery:GetService
                  - servicediscovery:ListNamespaces
                  - servicediscovery:ListOperations
                  - servicediscovery:ListServices
                  - servicediscovery:ListTagsForResource
                  - servicediscovery:TagResource
                  - servicediscovery:UntagResource
                  - servicediscovery:UpdateService
                Resource: "*"
              # Route 53 resources managed by Cloud Map.
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ChangeTagsForResource
                  - route53:CreateHostedZone
                  - route53:DeleteHostedZone
                  - route53:GetChange
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                Resource: "*"
              # Application Load Balancer deployment.
              - Effect: Allow
                Action:
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:AddListenerCertificates
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:CreateRule
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeListenerCertificates
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:ModifyRule
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:RemoveTags
                  - elasticloadbalancing:RemoveListenerCertificates
                  - elasticloadbalancing:SetIpAddressType
                  - elasticloadbalancing:SetSecurityGroups
                  - elasticloadbalancing:SetRulePriorities
                  - elasticloadbalancing:SetSubnets
                Resource: "*"
              # Read the configured ALB certificate.
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                Resource: !Sub "arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*"
              # Read the public Amazon Linux AMI parameter.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*"

  GitHubDeployCanaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lambda Alias, CloudWatch Alarm, and CodeDeploy permissions for SAM canary deployments.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:PutMetricAlarm
              - codedeploy:CreateApplication
              - codedeploy:CreateDeployment
              - codedeploy:CreateDeploymentGroup
              - codedeploy:DeleteApplication
              - codedeploy:DeleteDeploymentGroup
              - codedeploy:GetApplication
              - codedeploy:GetDeployment
              - codedeploy:GetDeploymentConfig
              - codedeploy:GetDeploymentGroup
              - codedeploy:ListApplications
              - codedeploy:ListDeploymentConfigs
              - codedeploy:ListDeployments
              - codedeploy:ListDeploymentGroups
              - codedeploy:ListTagsForResource
              - codedeploy:RegisterApplicationRevision
              - codedeploy:StopDeployment
              - codedeploy:TagResource
              - codedeploy:UntagResource
              - codedeploy:UpdateDeploymentGroup
              - lambda:CreateAlias
              - lambda:DeleteAlias
              - lambda:GetAlias
              - lambda:ListAliases
              - lambda:UpdateAlias
            Resource: "*"
      Roles:
        - !Ref GitHubDeployRole

Outputs:
  GitHubDeployRoleArn:
    Description: Role ARN to store in GitHub secret AWS_ROLE_TO_ASSUME.
    Value: !GetAtt GitHubDeployRole.Arn
