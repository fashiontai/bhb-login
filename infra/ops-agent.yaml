AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BHB Login read-only Observer and Triage Agent operations stack.

Parameters:
  ApplicationStackName:
    Type: String
    Default: bhb-login
    Description: Main application CloudFormation stack name.
  ApiFunctionName:
    Type: String
    Default: bhb-login-api
    Description: Node/Hono Lambda function name.
  ApiAliasName:
    Type: String
    Default: live
    Description: Lambda alias monitored by the Observer Agent.
  EcsClusterName:
    Type: String
    Description: Production Go ECS cluster name.
  EcsServiceName:
    Type: String
    Description: Production Go ECS service name.
  GoTargetGroupArn:
    Type: String
    Description: Production Go ALB target group ARN.
  DatabaseClusterIdentifier:
    Type: String
    Description: Aurora PostgreSQL cluster identifier.
  GithubEventsQueueUrl:
    Type: String
    Description: Main GitHub profile events queue URL.
  GithubEventsDlqUrl:
    Type: String
    Description: GitHub profile events dead-letter queue URL.
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
    Description: Observer Agent CloudWatch log retention.

  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email endpoint for degraded or critical operations notifications.
  WebhookParameterName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/[A-Za-z0-9_./-]+$"
    ConstraintDescription: Must be empty or an absolute SSM parameter name beginning with /.
    Description: Optional SSM SecureString parameter containing the app webhook URL or provider/url JSON.
  WebhookProvider:
    Type: String
    Default: generic
    AllowedValues:
      - dingtalk
      - feishu
      - generic
      - slack
      - wecom
    Description: Message format used when the SSM parameter contains a raw URL.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasNotificationWebhook: !Not [!Equals [!Ref WebhookParameterName, ""]]

Resources:
  OpsEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BHB Login operations events.
      TopicName: !Sub "${ApplicationStackName}-ops-events"
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-events"

  OpsObservationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BHB Login Observer Agent observations.
      TopicName: !Sub "${ApplicationStackName}-ops-observations"
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-observations"

  OpsTriageResultsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BHB Login Triage Agent results.
      TopicName: !Sub "${ApplicationStackName}-ops-triage-results"
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-triage-results"

  OpsNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BHB Login operations notifications.
      TopicName: !Sub "${ApplicationStackName}-ops-notifications"
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-notifications"

  OpsEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-events-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-events-dlq"

  OpsEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-events"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsEventsDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-events"

  OpsTriageDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-triage-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-triage-dlq"

  OpsTriageQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-triage"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsTriageDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-triage"

  OpsReleaseDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-release-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-release-dlq"

  OpsReleaseQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-release"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsReleaseDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-release"

  OpsWebhookDlq:
    Condition: HasNotificationWebhook
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-webhook-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-webhook-dlq"

  OpsWebhookBufferQueue:
    Condition: HasNotificationWebhook
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${ApplicationStackName}-ops-webhook-buffer"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsWebhookDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 240
      Tags:
        - Key: Name
          Value: !Sub "${ApplicationStackName}-ops-webhook-buffer"

  OpsEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OpsEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OpsEventsTopic
      Queues:
        - !Ref OpsEventsQueue

  OpsTriageQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OpsTriageQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OpsObservationsTopic
      Queues:
        - !Ref OpsTriageQueue

  OpsReleaseQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OpsReleaseQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OpsTriageResultsTopic
      Queues:
        - !Ref OpsReleaseQueue

  OpsWebhookDlqPolicy:
    Condition: HasNotificationWebhook
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OpsWebhookDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OpsNotificationsTopic
      Queues:
        - !Ref OpsWebhookDlq

  OpsWebhookBufferQueuePolicy:
    Condition: HasNotificationWebhook
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OpsWebhookBufferQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OpsNotificationsTopic
      Queues:
        - !Ref OpsWebhookBufferQueue

  OpsEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt OpsEventsQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      TopicArn: !Ref OpsEventsTopic

  OpsTriageSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt OpsTriageQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      TopicArn: !Ref OpsObservationsTopic

  OpsReleaseSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt OpsReleaseQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      TopicArn: !Ref OpsTriageResultsTopic

  OpsNotificationSubscription:
    Condition: HasNotificationEmail
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref NotificationEmail
      Protocol: email
      TopicArn: !Ref OpsNotificationsTopic

  OpsWebhookSubscription:
    Condition: HasNotificationWebhook
    Type: AWS::SNS::Subscription
    DependsOn:
      - WebhookNotifierInvokePermission
    Properties:
      Endpoint: !GetAtt WebhookNotifierFunction.Arn
      FilterPolicy:
        priority:
          - P0
      FilterPolicyScope: MessageAttributes
      Protocol: lambda
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsWebhookDlq.Arn
      TopicArn: !Ref OpsNotificationsTopic

  OpsWebhookDigestSubscription:
    Condition: HasNotificationWebhook
    Type: AWS::SNS::Subscription
    DependsOn:
      - OpsWebhookBufferQueuePolicy
    Properties:
      Endpoint: !GetAtt OpsWebhookBufferQueue.Arn
      FilterPolicy:
        priority:
          - P1
          - P2
      FilterPolicyScope: MessageAttributes
      Protocol: sqs
      RawMessageDelivery: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsWebhookDlq.Arn
      TopicArn: !Ref OpsNotificationsTopic

  OpsAlarmStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Send CloudWatch alarm state changes to the read-only Observer Agent.
      EventBusName: default
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          state:
            value:
              - ALARM
              - INSUFFICIENT_DATA
      State: ENABLED
      Targets:
        - Arn: !Ref OpsEventsTopic
          Id: OpsEventsTopicTarget

  OpsEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OpsEventsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OpsAlarmStateChangeRule.Arn
      Topics:
        - !Ref OpsEventsTopic

  ObserverAgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationStackName}-ops-observer"
      RetentionInDays: !Ref LogRetentionInDays

  ObserverAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationStackName}-ops-observer"
      CodeUri: ../apps/ops-agent/dist/
      Handler: observer.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:DescribeAlarms
                - ecs:DescribeClusters
                - ecs:DescribeServices
                - elasticloadbalancing:DescribeTargetHealth
                - lambda:GetAlias
                - rds:DescribeDBClusters
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OpsObservationsTopic
      Environment:
        Variables:
          OPS_API_FUNCTION_NAME: !Ref ApiFunctionName
          OPS_API_ALIAS_NAME: !Ref ApiAliasName
          OPS_ECS_CLUSTER_NAME: !Ref EcsClusterName
          OPS_ECS_SERVICE_NAME: !Ref EcsServiceName
          OPS_GO_TARGET_GROUP_ARN: !Ref GoTargetGroupArn
          OPS_DATABASE_CLUSTER_IDENTIFIER: !Ref DatabaseClusterIdentifier
          OPS_GITHUB_EVENTS_QUEUE_URL: !Ref GithubEventsQueueUrl
          OPS_GITHUB_EVENTS_DLQ_URL: !Ref GithubEventsDlqUrl
          OPS_OBSERVATIONS_TOPIC_ARN: !Ref OpsObservationsTopic
          OPS_APPLICATION_STACK_NAME: !Ref ApplicationStackName
      Events:
        OpsEvents:
          Type: SQS
          Properties:
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumBatchingWindowInSeconds: 10
            Queue: !GetAtt OpsEventsQueue.Arn

  TriageAgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationStackName}-ops-triage"
      RetentionInDays: !Ref LogRetentionInDays

  TriageAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationStackName}-ops-triage"
      CodeUri: ../apps/ops-agent/dist/
      Handler: triage.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
              Resource: !GetAtt OpsTriageQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OpsTriageResultsTopic
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:Invoke
              Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OpsMcpApi}/*/POST/mcp"
      Environment:
        Variables:
          OPS_APPLICATION_STACK_NAME: !Ref ApplicationStackName
          OPS_MCP_ENDPOINT: !Sub "https://${OpsMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp"
          OPS_TRIAGE_RESULTS_TOPIC_ARN: !Ref OpsTriageResultsTopic
      Events:
        TriageObservations:
          Type: SQS
          Properties:
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumBatchingWindowInSeconds: 10
            Queue: !GetAtt OpsTriageQueue.Arn

  ReleaseAgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationStackName}-ops-release"
      RetentionInDays: !Ref LogRetentionInDays

  ReleaseAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationStackName}-ops-release"
      CodeUri: ../apps/ops-agent/dist/
      Handler: release.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
              Resource: !GetAtt OpsReleaseQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref OpsNotificationsTopic
      Environment:
        Variables:
          OPS_APPLICATION_STACK_NAME: !Ref ApplicationStackName
          OPS_NOTIFICATIONS_TOPIC_ARN: !Ref OpsNotificationsTopic
      Events:
        ReleaseTriageResults:
          Type: SQS
          Properties:
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumBatchingWindowInSeconds: 10
            Queue: !GetAtt OpsReleaseQueue.Arn

  WebhookNotifierLogGroup:
    Condition: HasNotificationWebhook
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationStackName}-ops-webhook"
      RetentionInDays: !Ref LogRetentionInDays

  WebhookNotifierFunction:
    Condition: HasNotificationWebhook
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationStackName}-ops-webhook"
      CodeUri: ../apps/ops-agent/dist/
      Handler: webhook.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 10
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt OpsWebhookDlq.Arn
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt OpsWebhookBufferQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebhookParameterName}"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt OpsWebhookDlq.Arn
      Environment:
        Variables:
          OPS_WEBHOOK_BUFFER_QUEUE_URL: !Ref OpsWebhookBufferQueue
          OPS_WEBHOOK_PARAMETER_NAME: !Ref WebhookParameterName
          OPS_WEBHOOK_PROVIDER: !Ref WebhookProvider
      Events:
        WebhookDigestSchedule:
          Type: Schedule
          Properties:
            Description: Flush P1 and P2 app notifications as one digest every two minutes.
            Enabled: true
            Schedule: rate(2 minutes)

  WebhookNotifierInvokePermission:
    Condition: HasNotificationWebhook
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebhookNotifierFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref OpsNotificationsTopic

  OpsMcpServerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationStackName}-ops-mcp"
      RetentionInDays: !Ref LogRetentionInDays

  OpsMcpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationStackName}-ops-mcp"
      CodeUri: ../apps/ops-mcp-server/dist/
      Handler: lambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:DescribeAlarms
                - ecs:DescribeClusters
                - ecs:DescribeServices
                - elasticloadbalancing:DescribeTargetHealth
                - lambda:GetAlias
                - logs:FilterLogEvents
                - rds:DescribeDBClusters
                - sqs:GetQueueAttributes
              Resource: "*"
      Environment:
        Variables:
          OPS_API_FUNCTION_NAME: !Ref ApiFunctionName
          OPS_API_ALIAS_NAME: !Ref ApiAliasName
          OPS_ECS_CLUSTER_NAME: !Ref EcsClusterName
          OPS_ECS_SERVICE_NAME: !Ref EcsServiceName
          OPS_GO_TARGET_GROUP_ARN: !Ref GoTargetGroupArn
          OPS_DATABASE_CLUSTER_IDENTIFIER: !Ref DatabaseClusterIdentifier
          OPS_GITHUB_EVENTS_QUEUE_URL: !Ref GithubEventsQueueUrl
          OPS_GITHUB_EVENTS_DLQ_URL: !Ref GithubEventsDlqUrl
          OPS_APPLICATION_STACK_NAME: !Ref ApplicationStackName

  OpsMcpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ApplicationStackName}-ops-mcp"
      ProtocolType: HTTP

  OpsMcpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref OpsMcpApi
      IntegrationMethod: POST
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OpsMcpServerFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  OpsMcpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OpsMcpApi
      AuthorizationType: AWS_IAM
      RouteKey: POST /mcp
      Target: !Sub "integrations/${OpsMcpIntegration}"

  OpsMcpDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref OpsMcpApi
      AutoDeploy: true
      StageName: $default

  OpsMcpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OpsMcpServerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OpsMcpApi}/*/POST/mcp"

Outputs:
  ObserverAgentFunctionName:
    Description: Observer Agent Lambda function name.
    Value: !Ref ObserverAgentFunction
  TriageAgentFunctionName:
    Description: Triage Agent Lambda function name.
    Value: !Ref TriageAgentFunction
  ReleaseAgentFunctionName:
    Description: Release and approval gate function name.
    Value: !Ref ReleaseAgentFunction
  WebhookNotifierFunctionName:
    Condition: HasNotificationWebhook
    Description: SNS-to-app webhook notification function name.
    Value: !Ref WebhookNotifierFunction
  OpsMcpServerFunctionName:
    Description: Read-only operations MCP Server Lambda function name.
    Value: !Ref OpsMcpServerFunction
  OpsMcpEndpoint:
    Description: IAM-authorized Streamable HTTP endpoint used by the Triage Agent.
    Value: !Sub "https://${OpsMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp"
  OpsEventsTopicArn:
    Description: SNS topic receiving operations events.
    Value: !Ref OpsEventsTopic
  OpsObservationsTopicArn:
    Description: SNS topic carrying Observer Agent observations.
    Value: !Ref OpsObservationsTopic
  OpsTriageResultsTopicArn:
    Description: SNS topic carrying Triage Agent results.
    Value: !Ref OpsTriageResultsTopic
  OpsNotificationsTopicArn:
    Description: SNS topic for degraded and critical notifications.
    Value: !Ref OpsNotificationsTopic
  OpsEventsQueueUrl:
    Description: SQS queue consumed by the Observer Agent.
    Value: !Ref OpsEventsQueue
  OpsEventsDlqUrl:
    Description: Observer Agent dead-letter queue URL.
    Value: !Ref OpsEventsDlq
  OpsTriageQueueUrl:
    Description: Triage Agent queue URL.
    Value: !Ref OpsTriageQueue
  OpsTriageDlqUrl:
    Description: Triage Agent dead-letter queue URL.
    Value: !Ref OpsTriageDlq
  OpsReleaseQueueUrl:
    Description: Release and approval gate queue URL.
    Value: !Ref OpsReleaseQueue
  OpsReleaseDlqUrl:
    Description: Release and approval gate dead-letter queue URL.
    Value: !Ref OpsReleaseDlq
  OpsWebhookDlqUrl:
    Condition: HasNotificationWebhook
    Description: Failed app webhook notification dead-letter queue URL.
    Value: !Ref OpsWebhookDlq
  OpsWebhookBufferQueueUrl:
    Condition: HasNotificationWebhook
    Description: P1 and P2 app notification aggregation queue URL.
    Value: !Ref OpsWebhookBufferQueue
