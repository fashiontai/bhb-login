AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BHB Login serverless deployment.

Parameters:
  DatabaseName:
    Type: String
    Default: bhblogin
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
    Description: PostgreSQL database name for the application.
  DatabaseUsername:
    Type: String
    Default: bhbadmin
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
    Description: PostgreSQL master username.
  DatabaseMinCapacity:
    Type: Number
    Default: 0.5
    MinValue: 0.5
    MaxValue: 128
    Description: Minimum Aurora Serverless v2 capacity in ACUs.
  DatabaseMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 0.5
    MaxValue: 128
    Description: Maximum Aurora Serverless v2 capacity in ACUs.
  BetterAuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Better Auth secret, at least 32 characters.
  BetterAuthUrl:
    Type: String
    Description: Public server URL used by Better Auth.
  CorsOrigin:
    Type: String
    Description: Public web origin allowed by CORS.
  CloudflarePagesDomain:
    Type: String
    Default: bhb-login.pages.dev
    AllowedPattern: "^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
    Description: Cloudflare Pages project domain whose branch previews are allowed by CORS.
  GoInternalServiceToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared token used only for Lambda-to-Go internal requests.
  GoProfileImageUri:
    Type: String
    Default: ""
    Description: ECR image URI for the Go profile service. Leave empty during the bootstrap deployment.
  GoProfileDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Desired number of production Go profile tasks.
  PerformanceProcessorDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
    Description: Desired number of private performance processing worker tasks.
  GoProfileCertificateArn:
    Type: String
    AllowedPattern: "^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[A-Za-z0-9-]+$"
    Description: ACM certificate ARN for the public Go profile HTTPS listener.
  GoProfilePublicDomainName:
    Type: String
    Default: go-api.fashiontai.online
    Description: Public DNS name routed to the Go profile ALB.
  EnableHealthCanary:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create and run the CloudWatch Synthetics health canary.
  EnableApiCanary:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable the Lambda CodeDeploy canary deployment.
  NodeEnv:
    Type: String
    Default: production
    AllowedValues:
      - development
      - production
      - test
    Description: Runtime NODE_ENV value.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the application VPC.
  PublicSubnetCidr:
    Type: String
    Default: 10.20.0.0/24
    Description: CIDR block for the first public subnet.
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.1.0/24
    Description: CIDR block for the second public subnet.
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.10.0/24
    Description: CIDR block for the first private Lambda subnet.
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.20.0/24
    Description: CIDR block for the second private Lambda subnet.
  BastionAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 ARM64 AMI for the SSM bastion.
  BastionInstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues:
      - t4g.nano
      - t4g.micro
      - t4g.small
    Description: EC2 instance type for the SSM bastion.

Conditions:
  ShouldDeployGoProfileService: !Not
    - !Equals
      - !Ref GoProfileImageUri
      - ""
  ShouldDeployHealthCanary: !Equals
    - !Ref EnableHealthCanary
    - "true"

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        NODE_ENV: !Ref NodeEnv

Resources:
  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Aurora PostgreSQL credentials for the BHB Login application.
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: password
        PasswordLength: 32
        SecretStringTemplate: !Sub '{"username":"${DatabaseUsername}"}'
      Name: !Sub "${AWS::StackName}/database/credentials"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-database-credentials"

  GoInternalServiceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared authentication token for Lambda-to-Go internal requests.
      SecretString: !Ref GoInternalServiceToken
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-internal-token"

  GoProfileRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmptyOnDelete: false
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 most recent Go profile images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryName: !Sub "${AWS::StackName}-go-profile"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile"

  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref AppVpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"
      VpcId: !Ref AppVpc

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"
      VpcId: !Ref AppVpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      CidrBlock: !Ref PrivateSubnetACidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"
      VpcId: !Ref AppVpc

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      CidrBlock: !Ref PrivateSubnetBCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"
      VpcId: !Ref AppVpc

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"
      VpcId: !Ref AppVpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"
      VpcId: !Ref AppVpc

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnetB

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowCredentials: true
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - DELETE
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - !Ref CorsOrigin

  ApiAliasErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Roll back the API Lambda canary when the live alias reports an error.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
        - Name: Resource
          Value: !Sub "${ApiFunction}:live"
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 60
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching

  GithubProfileEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: GitHub profile events.
      TopicName: !Sub "${AWS::StackName}-github-profile-events"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-github-profile-events"

  GithubProfileEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${AWS::StackName}-github-profile-events-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-github-profile-events-dlq"

  GithubProfileEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${AWS::StackName}-github-profile-events"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GithubProfileEventsDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-github-profile-events"

  GithubProfileEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GithubProfileEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref GithubProfileEventsTopic
        Version: "2012-10-17"
      Queues:
        - !Ref GithubProfileEventsQueue

  GithubProfileEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt GithubProfileEventsQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      TopicArn: !Ref GithubProfileEventsTopic

  PerformanceEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${AWS::StackName}-performance-events-dlq"
      SqsManagedSseEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-performance-events-dlq"

  PerformanceEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      QueueName: !Sub "${AWS::StackName}-performance-events"
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PerformanceEventsDlq.Arn
        maxReceiveCount: 3
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-performance-events"

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the BHB Login Lambda function.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-lambda-sg"
      VpcId: !Ref AppVpc

  GoProfileSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the Go profile Fargate service.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      SecurityGroupIngress:
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          ToPort: 8080
        - FromPort: 8080
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref GoProfileAlbSecurityGroup
          ToPort: 8080
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile-sg"
      VpcId: !Ref AppVpc

  GoProfileAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the public Go profile ALB.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
        - CidrIp: 0.0.0.0/0
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile-alb-sg"
      VpcId: !Ref AppVpc

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the BHB Login database.
      SecurityGroupIngress:
        - FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          ToPort: 5432
        - FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          ToPort: 5432
        - FromPort: 5432
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref GoProfileSecurityGroup
          ToPort: 5432
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"
      VpcId: !Ref AppVpc

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the private SSM database bastion.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ssm-bastion-sg"
      VpcId: !Ref AppVpc

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ssm-bastion-role"

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionRole

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      IamInstanceProfile: !Ref BastionInstanceProfile
      ImageId: !Ref BastionAmiId
      InstanceType: !Ref BastionInstanceType
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: 0
          GroupSet:
            - !Ref BastionSecurityGroup
          SubnetId: !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ssm-bastion"

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the BHB Login database.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-subnet-group"

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      BackupRetentionPeriod: 1
      DatabaseName: !Ref DatabaseName
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Engine: aurora-postgresql
      EngineVersion: "16.13"
      MasterUsername: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}"
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DatabaseMinCapacity
        MaxCapacity: !Ref DatabaseMaxCapacity
      StorageEncrypted: true
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AutoMinorVersionUpgrade: true
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  GoProfileLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/go-profile"
      RetentionInDays: 14

  GoProfileCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-go-profile"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile"

  GoProfileNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Description: Private service discovery namespace for the BHB Login stack.
      Name: !Sub "${AWS::StackName}.local"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-namespace"
      Vpc: !Ref AppVpc

  GoProfileDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Description: Private DNS records for the Go profile Fargate tasks.
      DnsConfig:
        DnsRecords:
          - TTL: 10
            Type: A
        NamespaceId: !Ref GoProfileNamespace
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Name: go-profile
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile-discovery"

  GoProfileLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Name: !Sub "${AWS::StackName}-go"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref GoProfileAlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile"
      Type: application

  GoProfileTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /ready
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Port: 8080
      Protocol: HTTP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      TargetType: ip
      UnhealthyThresholdCount: 3
      VpcId: !Ref AppVpc

  GoProfileAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - RedirectConfig:
            Port: "443"
            Protocol: HTTPS
            StatusCode: HTTP_301
          Type: redirect
      LoadBalancerArn: !Ref GoProfileLoadBalancer
      Port: 80
      Protocol: HTTP

  GoProfileHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref GoProfileCertificateArn
      DefaultActions:
        - FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":"not_found"}'
            StatusCode: "404"
          Type: fixed-response
      LoadBalancerArn: !Ref GoProfileLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

  GoProfilePublicRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - TargetGroupArn: !Ref GoProfileTargetGroup
          Type: forward
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /health
              - /ready
              - /public/*
      ListenerArn: !Ref GoProfileHttpsListener
      Priority: 50000

  GoProfileTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadGoProfileSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseCredentialsSecret
                  - !Ref GoInternalServiceSecret
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-task-execution-role"

  GoProfileTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-task-role"
      Policies:
        - PolicyName: ConsumePerformanceEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt PerformanceEventsQueue.Arn

  GoProfileTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: ShouldDeployGoProfileService
    Properties:
      ContainerDefinitions:
        - Essential: true
          Environment:
            - Name: DATABASE_HOST
              Value: !GetAtt DatabaseCluster.Endpoint.Address
            - Name: DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: DATABASE_PORT
              Value: !GetAtt DatabaseCluster.Endpoint.Port
            - Name: DATABASE_SSL_MODE
              Value: require
            - Name: GITHUB_API_URL
              Value: https://api.github.com
            - Name: GO_CORS_ORIGIN
              Value: !Ref CorsOrigin
            - Name: CLOUDFLARE_PAGES_DOMAIN
              Value: !Ref CloudflarePagesDomain
            - Name: GO_SERVER_PORT
              Value: "8080"
          Image: !Ref GoProfileImageUri
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GoProfileLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: go-profile
          Name: go-profile
          PortMappings:
            - AppProtocol: http
              ContainerPort: 8080
              Name: http
              Protocol: tcp
          Secrets:
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:password::"
            - Name: DATABASE_USERNAME
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:username::"
            - Name: GO_INTERNAL_SERVICE_TOKEN
              ValueFrom: !Ref GoInternalServiceSecret
      Cpu: "256"
      ExecutionRoleArn: !GetAtt GoProfileTaskExecutionRole.Arn
      Family: !Sub "${AWS::StackName}-go-profile"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt GoProfileTaskRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile"

  GoProfileService:
    Type: AWS::ECS::Service
    Condition: ShouldDeployGoProfileService
    DependsOn:
      - GoProfilePublicRoute
      - PrivateDefaultRoute
      - PrivateSubnetARouteTableAssociation
      - PrivateSubnetBRouteTableAssociation
    Properties:
      Cluster: !Ref GoProfileCluster
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DesiredCount: !Ref GoProfileDesiredCount
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: go-profile
          ContainerPort: 8080
          TargetGroupArn: !Ref GoProfileTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref GoProfileSecurityGroup
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
      PlatformVersion: "1.4.0"
      PropagateTags: SERVICE
      ServiceName: !Sub "${AWS::StackName}-go-profile"
      ServiceRegistries:
        - RegistryArn: !GetAtt GoProfileDiscoveryService.Arn
      TaskDefinition: !Ref GoProfileTaskDefinition
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-go-profile"

  PerformanceProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldDeployGoProfileService
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/performance-processor"
      RetentionInDays: 14

  PerformanceProcessorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: ShouldDeployGoProfileService
    Properties:
      ContainerDefinitions:
        - Command:
            - processor
          Essential: true
          Environment:
            - Name: DATABASE_HOST
              Value: !GetAtt DatabaseCluster.Endpoint.Address
            - Name: DATABASE_NAME
              Value: !Ref DatabaseName
            - Name: DATABASE_PORT
              Value: !GetAtt DatabaseCluster.Endpoint.Port
            - Name: DATABASE_SCHEMA
              Value: public
            - Name: DATABASE_SSL_MODE
              Value: require
            - Name: PERFORMANCE_EVENTS_QUEUE_URL
              Value: !Ref PerformanceEventsQueue
          Image: !Ref GoProfileImageUri
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PerformanceProcessorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: performance
          Name: performance-processor
          Secrets:
            - Name: DATABASE_PASSWORD
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:password::"
            - Name: DATABASE_USERNAME
              ValueFrom: !Sub "${DatabaseCredentialsSecret}:username::"
            - Name: GO_INTERNAL_SERVICE_TOKEN
              ValueFrom: !Ref GoInternalServiceSecret
      Cpu: "256"
      ExecutionRoleArn: !GetAtt GoProfileTaskExecutionRole.Arn
      Family: !Sub "${AWS::StackName}-performance-processor"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt GoProfileTaskRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-performance-processor"

  PerformanceProcessorService:
    Type: AWS::ECS::Service
    Condition: ShouldDeployGoProfileService
    DependsOn:
      - PrivateDefaultRoute
      - PrivateSubnetARouteTableAssociation
      - PrivateSubnetBRouteTableAssociation
    Properties:
      Cluster: !Ref GoProfileCluster
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: !Ref PerformanceProcessorDesiredCount
      EnableECSManagedTags: true
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref GoProfileSecurityGroup
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
      PlatformVersion: "1.4.0"
      PropagateTags: SERVICE
      ServiceName: !Sub "${AWS::StackName}-performance-processor"
      TaskDefinition: !Ref PerformanceProcessorTaskDefinition
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-performance-processor"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: apps/server/dist/
      Handler: index.handler
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Enabled: !Equals
          - !Ref EnableApiCanary
          - "true"
        Type: Canary10Percent5Minutes
        Alarms:
          - !Ref ApiAliasErrorAlarm
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref GithubProfileEventsTopic
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt PerformanceEventsQueue.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql://${Username}:${Password}@${Host}:${Port}/${Name}"
            - Username: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:username}}"
              Password: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}"
              Host: !GetAtt DatabaseCluster.Endpoint.Address
              Port: !GetAtt DatabaseCluster.Endpoint.Port
              Name: !Ref DatabaseName
          BETTER_AUTH_SECRET: !Ref BetterAuthSecret
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          CORS_ORIGIN: !Ref CorsOrigin
          CLOUDFLARE_PAGES_DOMAIN: !Ref CloudflarePagesDomain
          GO_INTERNAL_SERVICE_TOKEN: !Ref GoInternalServiceToken
          GO_PROFILE_SERVICE_NAMESPACE: !Sub "${AWS::StackName}.local"
          GO_PROFILE_SERVICE_URL: !Sub "http://go-profile.${AWS::StackName}.local:8080"
          GITHUB_PROFILE_EVENTS_TOPIC_ARN: !Ref GithubProfileEventsTopic
          PERFORMANCE_EVENTS_QUEUE_URL: !Ref PerformanceEventsQueue
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  MigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-migrate"
      CodeUri: apps/server/dist/
      Handler: index.migrationHandler
      Timeout: 120
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          DATABASE_URL: !Sub
            - "postgresql://${Username}:${Password}@${Host}:${Port}/${Name}"
            - Username: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:username}}"
              Password: !Sub "{{resolve:secretsmanager:${DatabaseCredentialsSecret}:SecretString:password}}"
              Host: !GetAtt DatabaseCluster.Endpoint.Address
              Port: !GetAtt DatabaseCluster.Endpoint.Port
              Name: !Ref DatabaseName
          BETTER_AUTH_SECRET: !Ref BetterAuthSecret
          BETTER_AUTH_URL: !Ref BetterAuthUrl
          CORS_ORIGIN: !Ref CorsOrigin
          CLOUDFLARE_PAGES_DOMAIN: !Ref CloudflarePagesDomain
          GO_INTERNAL_SERVICE_TOKEN: !Ref GoInternalServiceToken
          GO_PROFILE_SERVICE_NAMESPACE: !Sub "${AWS::StackName}.local"
          GO_PROFILE_SERVICE_URL: !Sub "http://go-profile.${AWS::StackName}.local:8080"

  GithubProfileEventWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-github-profile-event-worker"
      CodeUri: apps/server/dist/
      Handler: github-profile-event-worker.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ReceiveMessage
              Resource: !GetAtt GithubProfileEventsQueue.Arn
      Events:
        GithubProfileEvents:
          Type: SQS
          Properties:
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            MaximumBatchingWindowInSeconds: 10
            Queue: !GetAtt GithubProfileEventsQueue.Arn

  SyntheticsArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldDeployHealthCanary
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCanaryArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-synthetics-artifacts"
      VersioningConfiguration:
        Status: Enabled

  SyntheticsExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployHealthCanary
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchSyntheticsExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SyntheticsArtifactBucket}/canaries/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt SyntheticsArtifactBucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub
                  - "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-${CanaryName}-*"
                  - CanaryName: !Sub "${AWS::StackName}-health"
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - xray:PutTraceSegments
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-synthetics-role"

  HealthCanary:
    Type: AWS::Synthetics::Canary
    Condition: ShouldDeployHealthCanary
    Properties:
      ArtifactS3Location: !Sub "s3://${SyntheticsArtifactBucket}/canaries"
      Code:
        Handler: index.handler
        Script: !Sub |
          const synthetics = require('@aws/synthetics-puppeteer');
          const log = require('@aws/synthetics-logger');

          async function checkEndpoint(stepName, url) {
            await synthetics.executeHttpStep(stepName, url, (response) => {
              if (response.statusCode < 200 || response.statusCode > 299) {
                throw new Error(stepName + ' returned HTTP ' + response.statusCode);
              }
              log.info(stepName + ' returned HTTP ' + response.statusCode);
            });
          }

          exports.handler = async () => {
            await checkEndpoint(
              'frontend-health',
              '${CorsOrigin}'
            );
            await checkEndpoint(
              'node-api-health',
              'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/hello'
            );
            await checkEndpoint(
              'go-api-health',
              'https://${GoProfilePublicDomainName}/health'
            );
          };
      ExecutionRoleArn: !GetAtt SyntheticsExecutionRole.Arn
      FailureRetentionPeriod: 30
      Name: !Sub "${AWS::StackName}-health"
      RunConfig:
        MemoryInMB: 960
        TimeoutInSeconds: 60
      RuntimeVersion: syn-nodejs-puppeteer-17.0
      Schedule:
        Expression: rate(5 minutes)
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-health"

  HealthCanaryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldDeployHealthCanary
    Properties:
      AlarmName: !Sub "${AWS::StackName}-health-canary-failure"
      AlarmDescription: Alert when the production Synthetics health canary fails.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: CanaryName
          Value: !Ref HealthCanary
      EvaluationPeriods: 1
      MetricName: Failed
      Namespace: CloudWatchSynthetics
      Period: 300
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching

Outputs:
  AppVpcId:
    Description: Application VPC ID.
    Value: !Ref AppVpc
  PublicSubnetId:
    Description: First public subnet ID for NAT Gateway and ALB.
    Value: !Ref PublicSubnet
  PublicSubnetBId:
    Description: Second public subnet ID for ALB.
    Value: !Ref PublicSubnetB
  PrivateSubnetAId:
    Description: First private subnet ID for Lambda.
    Value: !Ref PrivateSubnetA
  PrivateSubnetBId:
    Description: Second private subnet ID for Lambda.
    Value: !Ref PrivateSubnetB
  NatGatewayId:
    Description: NAT Gateway ID for private subnet outbound access.
    Value: !Ref NatGateway
  LambdaSecurityGroupId:
    Description: Lambda security group ID.
    Value: !Ref LambdaSecurityGroup
  DatabaseSecurityGroupId:
    Description: Database security group ID.
    Value: !Ref DatabaseSecurityGroup
  GoProfileSecurityGroupId:
    Description: Go profile Fargate security group ID.
    Value: !Ref GoProfileSecurityGroup
  GoProfileAlbSecurityGroupId:
    Description: Public Go profile ALB security group ID.
    Value: !Ref GoProfileAlbSecurityGroup
  BastionInstanceId:
    Description: Private SSM bastion instance ID for database tunnels.
    Value: !Ref BastionInstance
  BastionSecurityGroupId:
    Description: SSM bastion security group ID.
    Value: !Ref BastionSecurityGroup
  DatabaseEndpoint:
    Description: Aurora PostgreSQL cluster endpoint address.
    Value: !GetAtt DatabaseCluster.Endpoint.Address
  DatabaseCredentialsSecretArn:
    Description: Secrets Manager ARN for the Aurora PostgreSQL credentials.
    Value: !Ref DatabaseCredentialsSecret
  DatabasePort:
    Description: Aurora PostgreSQL cluster endpoint port.
    Value: !GetAtt DatabaseCluster.Endpoint.Port
  DatabaseTunnelCommand:
    Description: Local command to open a PostgreSQL tunnel through Session Manager.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${BastionInstance}
      --document-name AWS-StartPortForwardingSessionToRemoteHost
      --parameters '{"host":["${DatabaseCluster.Endpoint.Address}"],"portNumber":["${DatabaseCluster.Endpoint.Port}"],"localPortNumber":["15432"]}'
  DatabaseName:
    Description: RDS PostgreSQL database name.
    Value: !Ref DatabaseName
  ApiUrl:
    Description: HTTP API URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiAliasArn:
    Description: Lambda alias ARN used by the API deployment.
    Value: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ApiFunction}:live"
  ApiFunctionName:
    Description: Lambda function name used by the Node/Hono API.
    Value: !Ref ApiFunction
  GoProfileRepositoryName:
    Description: ECR repository name for the Go profile service.
    Value: !Ref GoProfileRepository
  GoProfileRepositoryUri:
    Description: ECR repository URI for the Go profile service.
    Value: !GetAtt GoProfileRepository.RepositoryUri
  GoProfileClusterName:
    Description: ECS cluster name for the Go profile service.
    Value: !Ref GoProfileCluster
  GoProfileTaskExecutionRoleArn:
    Description: ECS task execution role shared by production and PR Go tasks.
    Value: !GetAtt GoProfileTaskExecutionRole.Arn
  GoProfileTaskRoleArn:
    Description: ECS application task role shared by production and PR Go tasks.
    Value: !GetAtt GoProfileTaskRole.Arn
  GoProfileCloudMapNamespace:
    Description: Private Cloud Map namespace used by Lambda.
    Value: !Sub "${AWS::StackName}.local"
  GoProfileInternalUrl:
    Description: Private Go profile URL resolved through Cloud Map.
    Value: !Sub "http://go-profile.${AWS::StackName}.local:8080"
  GoProfileAlbDnsName:
    Description: Public ALB DNS name for the Go profile service.
    Value: !GetAtt GoProfileLoadBalancer.DNSName
  GoProfileTargetGroupArn:
    Description: Target group ARN used by the production Go profile ALB.
    Value: !Ref GoProfileTargetGroup
  DatabaseClusterIdentifier:
    Description: Aurora PostgreSQL cluster identifier used by the application.
    Value: !Ref DatabaseCluster
  GoProfilePublicUrl:
    Description: Public HTTPS URL for Go profile health and read-only endpoints.
    Value: !Sub "https://${GoProfilePublicDomainName}"
  GoProfileServiceName:
    Condition: ShouldDeployGoProfileService
    Description: ECS service name for the Go profile application.
    Value: !GetAtt GoProfileService.Name
  PerformanceProcessorServiceName:
    Condition: ShouldDeployGoProfileService
    Description: ECS service name for the private performance processing worker.
    Value: !GetAtt PerformanceProcessorService.Name
  GithubProfileEventsTopicArn:
    Description: SNS topic ARN for GitHub profile saved events.
    Value: !Ref GithubProfileEventsTopic
  GithubProfileEventsQueueUrl:
    Description: SQS queue URL for GitHub profile saved events.
    Value: !Ref GithubProfileEventsQueue
  GithubProfileEventsQueueArn:
    Description: SQS queue ARN for GitHub profile saved events.
    Value: !GetAtt GithubProfileEventsQueue.Arn
  GithubProfileEventsDlqUrl:
    Description: SQS dead-letter queue URL for GitHub profile saved events.
    Value: !Ref GithubProfileEventsDlq
  GithubProfileEventsDlqArn:
    Description: SQS dead-letter queue ARN for GitHub profile saved events.
    Value: !GetAtt GithubProfileEventsDlq.Arn
  PerformanceEventsQueueUrl:
    Description: SQS queue URL for raw performance events.
    Value: !Ref PerformanceEventsQueue
  PerformanceEventsQueueArn:
    Description: SQS queue ARN for raw performance events.
    Value: !GetAtt PerformanceEventsQueue.Arn
  PerformanceEventsDlqUrl:
    Description: SQS dead-letter queue URL for raw performance events.
    Value: !Ref PerformanceEventsDlq
  PerformanceEventsDlqArn:
    Description: SQS dead-letter queue ARN for raw performance events.
    Value: !GetAtt PerformanceEventsDlq.Arn
  HealthCanaryName:
    Condition: ShouldDeployHealthCanary
    Description: CloudWatch Synthetics canary checking the Node and Go health endpoints.
    Value: !Ref HealthCanary
  SyntheticsArtifactBucketName:
    Condition: ShouldDeployHealthCanary
    Description: S3 bucket retaining CloudWatch Synthetics artifacts.
    Value: !Ref SyntheticsArtifactBucket
  HealthCanaryFailureAlarmName:
    Condition: ShouldDeployHealthCanary
    Description: CloudWatch Alarm raised when the health canary fails.
    Value: !Ref HealthCanaryFailureAlarm
